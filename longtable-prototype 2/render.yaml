# Render blueprint: deploys the prototype as one web service.
services:
  - type: web
    name: longtable-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HL_VERIFY
        value: demo
